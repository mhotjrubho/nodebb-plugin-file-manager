name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install plugin dependencies
        run: npm install --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check library.js
          node --check lib/file-manager.js
          node --check lib/file-manager-extra.js
          node --check public/lib/admin.js
          node --check public/lib/acp.js
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin.json', 'utf8'))"
      - name: Verify CodeMirror package and assets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const pkg = require('./package.json');
          const plugin = require('./plugin.json');
          if (pkg.dependencies.codemirror !== '5.65.20') throw new Error('Unexpected CodeMirror version');
          if (plugin.staticDirs?.vendor !== 'node_modules/codemirror') throw new Error('CodeMirror static directory is not mapped');
          const files = [
            'lib/codemirror.js',
            'lib/codemirror.css',
            'theme/material-darker.css',
            'addon/fold/foldgutter.css',
            'addon/dialog/dialog.css',
            'addon/display/fullscreen.css',
            'mode/xml/xml.js',
            'mode/javascript/javascript.js',
            'mode/css/css.js',
            'mode/htmlmixed/htmlmixed.js',
            'mode/clike/clike.js',
            'mode/php/php.js',
            'mode/python/python.js',
            'mode/shell/shell.js',
            'mode/yaml/yaml.js',
            'mode/markdown/markdown.js',
            'mode/sql/sql.js',
            'addon/edit/closebrackets.js',
            'addon/edit/matchbrackets.js',
            'addon/edit/matchtags.js',
            'addon/edit/closetag.js',
            'addon/selection/active-line.js',
            'addon/display/fullscreen.js',
            'addon/fold/foldcode.js',
            'addon/fold/foldgutter.js',
            'addon/fold/brace-fold.js',
            'addon/fold/xml-fold.js',
            'addon/search/searchcursor.js',
            'addon/dialog/dialog.js',
            'addon/search/search.js',
            'addon/comment/comment.js',
            'addon/comment/continuecomment.js'
          ];
          const root = path.resolve(path.dirname(require.resolve('codemirror')), '..');
          for (const file of files) {
            if (!fs.existsSync(path.join(root, file))) throw new Error('Missing CodeMirror asset: ' + file);
          }
          NODE
      - name: Verify security and interface invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manager = fs.readFileSync('lib/file-manager.js', 'utf8');
          const extra = fs.readFileSync('lib/file-manager-extra.js', 'utf8');
          const library = fs.readFileSync('library.js', 'utf8');
          const page = fs.readFileSync('templates/admin/plugins/file-manager.tpl', 'utf8');
          const client = fs.readFileSync('public/lib/admin.js', 'utf8');
          const styles = fs.readFileSync('public/scss/admin.scss', 'utf8');

          const uploadStart = library.indexOf("router.post(\n        '/api/v3/plugins/file-manager/upload'");
          const editorGuard = library.indexOf('editorAccess', uploadStart);
          const passwordGuard = library.indexOf('requireFileManagerPassword', uploadStart);
          const multipart = library.indexOf('upload.any()', uploadStart);

          const checks = [
            [manager.includes('parts[0] === BACKUP_NAME'), 'protected backup directory'],
            [manager.includes('fs.promises.rename(target, trashFile)'), 'recoverable deletion'],
            [extra.includes('MAX_TOTAL') && extra.includes('5000'), 'upload and archive limits'],
            [extra.includes('async function purge(id)'), 'explicit permanent deletion'],
            [library.includes('middleware.requirePasswordAuth'), 'NodeBB native password verification'],
            [library.includes('crypto.scrypt') && library.includes('timingSafeEqual'), 'dedicated password hash and constant-time verification'],
            [library.includes('BOOTSTRAP_SECRET_FILE') && library.includes('0o077') && library.includes('safeSecretEquals'), 'server-side bootstrap secret file with strict permissions'],
            [library.includes('managerAdmins') && library.includes("item.role === 'manager'") && library.includes('isFileManagerAdmin'), 'explicit trusted file-manager administrators'],
            [library.includes("['viewer', 'editor', 'manager']"), 'viewer, editor and manager role validation'],
            [library.includes("'/api/v3/plugins/file-manager/bootstrap'") && library.includes('requireCurrentPassword'), 'bootstrap requires server key and NodeBB reauthentication'],
            [!library.includes('if (uid > 0 && await user.isAdministrator(uid)) return \'admin\''), 'NodeBB administrators no longer receive automatic file-manager access'],
            [library.includes('FM_PASSWORD_MIN_LENGTH = 12') && library.includes('FM_PASSWORD_MAX_ATTEMPTS = 5'), 'minimum password length and login throttling'],
            [library.includes('/credentials/status') && library.includes('/credentials/reset'), 'per-user password setup and admin reset'],
            [manager.includes('async function preview') && manager.includes('PREVIEW_IMAGES'), 'safe image and text preview'],
            [client.includes("['api', 'require']") && client.includes('amdRequire.config') && client.includes('amdRequire([moduleId]'), 'CodeMirror AMD loader receives the RequireJS dependency'],
            [client.includes('new AbortController()') && client.includes("state.uploadController.abort()"), 'cancellable upload requests'],
            [client.includes("$('fm-upload-progress-wrap').hidden = false"), 'visible upload progress wrapper'],
            [client.includes('secureFilePost') && client.includes('x-file-manager-password'), 'dedicated file manager password for file mutations'],
            [client.includes("newPassword: password") && library.includes('req.body && req.body.newPassword'), 'vault setup does not shadow NodeBB reauthentication password'],
            [page.includes('fm-preview-image') && page.includes('fm-preview-panel'), 'image preview UI'],
            [page.includes('fm-vault-dialog') && page.includes('fm-upload-cancel'), 'vault and upload cancel UI'],
            [page.includes('fm-bootstrap-dialog') && page.includes('fm-bootstrap-key'), 'first-time server bootstrap dialog'],
            [client.includes('startFileManager') && client.includes('submitBootstrapKey'), 'bootstrap UI startup and submission handlers'],
            [styles.includes('max-width: none') && styles.includes('direction: ltr') && styles.includes('grid-template-columns: 224px minmax(420px, 1fr) 320px'), 'full-width Explorer with fixed LTR pane placement'],
            [styles.includes('font-size: 13px') && !/font-size:\\s*(?:[1-9]|1[0-2])px/.test(styles), 'minimum readable interface typography'],
            [page.includes('fm-password-label-text') && client.includes("$('fm-password-label-text').textContent"), 'password dialog distinguishes account and vault keys'],
            [client.includes('autoCloseTags: true') && client.includes("'addon/edit/closetag.js'"), 'automatic HTML tag closing support'],
            [styles.includes('.fm-search-box .fm-search-submit') && !styles.includes('.fm-search-submit { display: none'), 'visible Explorer search action'],
            [client.includes("$('fm-upload-progress-wrap').hidden = true"), 'upload progress panel closes after completion or cancellation'],
            [client.includes("$('fm-editor').addEventListener('input', updateEditorStatus)"), 'fallback editor updates save status'],
            [styles.includes('max-width: 1240px') && styles.includes('grid-template-columns: 184px minmax(390px, 1fr) 276px'), 'compact Explorer layout'],
            [styles.includes('.fm-overlay-panel') && styles.includes('position: fixed'), 'floating backups and user management panels'],
            [library.includes('settings.allowedUsers') || library.includes('allowedUsers'), 'stored access list'],
            [library.includes("requestedPath === 'public' || requestedPath.startsWith('public/')"), 'viewer scope limited to public directory'],
            [uploadStart >= 0 && editorGuard > uploadStart && passwordGuard > editorGuard && multipart > passwordGuard, 'role and password checked before multipart upload'],
            [client.includes('CodeMirror.fromTextArea') && client.includes('lineNumbers: true'), 'CodeMirror with line numbers'],
            [client.includes('matchBrackets: true') && client.includes('foldGutter: true'), 'editor matching and code folding'],
            [client.includes('x-password-confirmation'), 'password sent through NodeBB-supported header'],
            [!client.includes('window.confirm') && !client.includes('prompt('), 'custom dialogs instead of browser prompts'],
            [page.includes('dir="rtl"') && page.includes('id="fm-password-dialog"'), 'RTL shell and password modal'],
            [styles.includes('direction: rtl') && styles.includes('direction: ltr'), 'mixed RTL and LTR styling'],
          ];
          for (const [ok, label] of checks) {
            if (!ok) throw new Error('Failed check: ' + label);
          }

          const ids = [...client.matchAll(/\$\('([^']+)'\)/g)].map(match => match[1]);
          for (const id of new Set(ids)) {
            if (!page.includes('id="' + id + '"')) throw new Error('Missing template element: ' + id);
          }
          NODE
